# ParaBank owns 8080 on localhost.
server.port=8090

# Show the reason with an error. The reasons are written for the person calling the API
# ("this session is waiting for a decision: send {"approve": true}"), and hiding them is unhelpful.
spring.web.error.include-message=always

# The application being automated.
automation.target-base-url=http://localhost:8080
automation.product=ParaBank
automation.product-version=2.1.0
automation.start-path=/parabank/index.htm
automation.policy-resource=policy/parabank.json

# Where recipes are kept, and where each run leaves its record.
automation.artifacts-dir=artifacts
automation.evidence-dir=runs

# A visible window is what lets a person take over. Set true for unattended runs.
automation.headless=false

# Discovery only. The API key is read from the ANTHROPIC_API_KEY environment variable.
automation.model=claude-opus-5-5
automation.max-turns=25

# How long a request waits for a run to need a person or finish.
automation.wait-seconds=120

# How long a paused run waits for a person to answer or take over before it stops itself.
# Once a person holds the window there is no limit.
automation.human-wait-seconds=300
