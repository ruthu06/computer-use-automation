# Target application: the official ParaBank demo, pinned by digest so every
# clone automates exactly the same build. Published on localhost only.
# State is in-memory: `docker compose down && docker compose up -d --wait` resets it.
services:
  parabank:
    image: parasoft/parabank@sha256:cebe472d86a10be23ce448f0f419f3c939a818112ab78cd57fc09e185f35d1c0
    ports:
      - "127.0.0.1:${PARABANK_PORT:-8080}:8080"
    healthcheck:
      # The image ships no curl/wget, so probe the home page over bash's /dev/tcp.
      # 302 also counts as up: until a first visitor triggers ParaBank's lazy database
      # setup, the home page redirects to initializeDB.htm and back.
      test:
        - CMD
        - bash
        - -c
        - exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /parabank/index.htm HTTP/1.0\r\n\r\n' >&3 && head -n 1 <&3 | grep -Eq ' (200|302)'
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
